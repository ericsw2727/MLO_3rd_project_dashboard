<article class="card calendar-panel" id="calendar" data-calendar data-today="{{ today }}" data-selected="{{ filter.end.value }}">
  <div class="calendar-header"><button type="button" data-calendar-prev aria-label="이전 달">‹</button><div><span>ACTIVITY CALENDAR</span><h2 data-calendar-title></h2></div><button type="button" data-calendar-next aria-label="다음 달">›</button></div>
  <div class="calendar-weekdays" aria-hidden="true"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
  <div class="calendar-days" data-calendar-days></div>
  <div class="calendar-caption"><span><i></i> 선택한 날짜</span><span><b></b> 오늘</span></div>
  <p class="calendar-help">날짜를 선택하면 해당 날짜의 기록을 조회합니다.</p>
  <noscript><p class="muted">위 분석 기간 필터에서 날짜를 선택해 주세요.</p></noscript>
</article>
