<div class="pagination">{% if page.has_previous %}<a href="?{{ querystring }}&page={{ page.previous_page_number }}">← 이전</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }} · {{ page.paginator.count }}건</span>{% if page.has_next %}<a href="?{{ querystring }}&page={{ page.next_page_number }}">다음 →</a>{% endif %}</div>
