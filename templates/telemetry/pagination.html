<div class="pagination"><span>{% if page.paginator.count %}{{ page.start_index }}–{{ page.end_index }} / 전체 {{ page.paginator.count }}건{% else %}총 0건{% endif %}</span><div class="pagination-pages">{% if page.has_previous %}<a href="?{{ querystring }}&page={{ page.previous_page_number }}">← 이전</a>{% endif %}<span class="page-current">{{ page.number }}</span><span>/ {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?{{ querystring }}&page={{ page.next_page_number }}">다음 →</a>{% endif %}</div></div>
