<div class="table-toolbar">
  <form class="table-search" method="get">
    {% for name, value in request.GET.items %}{% if name != 'q' and name != 'page' %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endif %}{% endfor %}
    <label for="table-search-input" class="sr-only">플레이어 검색</label><input id="table-search-input" name="q" value="{{ filter.q.value|default:'' }}" placeholder="이름 또는 외부 ID 검색" maxlength="150">
    <button type="submit" aria-label="검색">{% include 'accounts/nav_icon.html' with icon='search' %}</button>
  </form>
  <form class="sort-control" method="get">
    {% for name, value in request.GET.items %}{% if name != 'sort' and name != 'page' %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endif %}{% endfor %}
    <label for="table-sort">정렬</label><select id="table-sort" name="sort">{% for value, label in sort_options %}<option value="{{ value }}" {% if selected_sort == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button type="submit">적용</button>
  </form>
</div>
