<article class="card viz-card {{ chart_class }}">
  <div class="chart-head"><div><span class="eyebrow">{{ category }}</span><h2>{{ title }}</h2></div><span class="chart-mark" aria-hidden="true">↗</span></div>
  <p class="chart-question">{{ question }}</p>
  <div class="chart-container" data-chart="{{ chart }}" data-label="{{ title }}"></div>
  <div class="chart-legend"></div>
  <p class="chart-note">{{ note }}</p>
  <details class="chart-data"><summary>원자료 확인 <span>+</span></summary><div></div></details>
</article>
